ack{transform:rotateX(180deg)}.label{color:var(--p);font-weight:900}.qtext,.atext{flex:1;display:grid;place-items:center;text-align:center;font-size:clamp(25px,3vw,45px);font-weight:900;line-height:1.5}.atext{color:var(--ok)}.helper{padding:13px;border-radius:14px;background:var(--soft);color:var(--muted)}.hintline{text-align:center;color:var(--muted);font-size:13px}.controls{display:flex;justify-content:center;gap:9px}.controls .btn{min-height:56px;min-width:120px}.qpanel{padding:15px;overflow:auto}.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.qnum{aspect-ratio:1;border:0;border-radius:11px;background:var(--soft);color:var(--text);font-weight:900}.qnum.current{outline:3px solid var(--p)}.qnum.done{background:#dff7ea;color:#147c4b}.qnum.repeat{background:#fff0e2;color:#ad581d}.editor{display:grid;grid-template-columns:350px 1fr;gap:16px}.pad{padding:18px}.qrow{padding:12px;margin:8px 0;border:1px solid var(--line);border-radius:13px;cursor:pointer}.qrow.selected{border-color:var(--p);background:var(--soft)}label{display:block;margin:12px 0 6px;font-weight:800}.field{width:100%;min-height:47px;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--bg);color:var(--text)}textarea.field{min-height:92px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modalwrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:#080c1994}.modal{width:min(700px,100%);max-height:90vh;overflow:auto;padding:23px;border-radius:26px;background:var(--card)}.toast{position:fixed;z-index:100;left:50%;bottom:22px;transform:translateX(-50%);padding:13px 18px;border-radius:13px;background:#18213a;color:#fff}.countdown{text-align:center;color:var(--muted);font-weight:800}.swipe-guide{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;font-weight:800}.swipe-ok{color:var(--ok)}.swipe-again{color:var(--again)}.swipe-hold{color:var(--hold)}

.flash.enter-next .inner{animation:cardEnterRight .34s cubic-bezier(.2,.8,.2,1)}

"use strict";const KEY="manabi-card-v3",COL={国語:"#e64980",数学:"#3b82f6",英語:"#7950f2",理科:"#20a464",社会:"#f08c46",その他:"#6b7894"};const seed=[{id:"book1",sourceId:"book1",title:"中学歴史・鎌倉時代",subject:"社会",grade:"中学2年",unit:"鎌倉時代",color:COL.社会,locked:false,questions:[{id:"q1",question:"鎌倉幕府を開いた人物は誰ですか？",answer:"源頼朝",hint:"征夷大将軍",explanation:"鎌倉を本拠地として武家政権を築きました。",difficulty:"基礎",tags:"人物"},{id:"q2",question:"将軍と主従関係を結んだ武士を何といいますか？",answer:"御家人",hint:"御がつきます",explanation:"将軍から土地の保護などを受けました。",difficulty:"基礎",tags:"制度"},{id:"q3",question:"1232年に北条泰時が定めた武士の法律は？",answer:"御成敗式目",hint:"武士の法律",explanation:"武士の裁判基準となりました。",difficulty:"標準",tags:"法律"}]},{"id":"bmuagowjeaster","sourceId":"srcmuagowjeq1zbt","title":"酸アルカリとイオン","subject":"理科","grade":"中学3年","unit":"酸アルカリとイオン","color":"#20a464","locked":false,"questions":[{"id":"qmuagp1wuuzs5n","question":"酸性の水溶液は青色リトマス紙を何色に変えるか。","answer":"赤色","hint":"","explanation":"","difficulty":"基礎","tags":""},{"id":"qmuagp1wuwmoxn","question":"アルカリ性の水溶液は赤色リトマス紙を何色に変えるか。","answer":"青色","hint":"","explanation":"","difficulty":"基礎","tags":""},{"id":"qmuagp1wuf4x32","question":"食塩水は酸性・中性・アルカリ性のどれか。","answer":"中性","hint":"","explanation":"","difficulty":"基礎","tags":""},{"id":"qmuagp1wuf58rl","question":"レモンのしぼり汁は何性か。","answer":"酸性","hint":"","explanation":"","difficulty":"基礎","tags":""},{"id":"qmuagp1wum3z36","question":"セッケン水は何性か。","answer":"アルカリ性","hint":"","explanation":"","difficulty":"基礎","tags":""},{"id":"qmuagp1wunscz3","question":"アンモニアが水に溶けると何性の水溶液になるか。","answer":"アルカリ性","hint":"","explanation":"","difficulty":"基礎","tags":""},{"id":"qmuagp1wuvsw4q","question":"酸性の水溶液にBTB溶液を加えると何色になるか。","answer":"黄色","hint":"","explanation":"","difficulty":"基礎","tags":""},{"id":"qmuagp1wus3p98","question":"中性の水溶液にBTB溶液を加えると何色になるか。","answer":"緑色","hint":"","explanation":"","difficulty":"基礎","tags":""},{"id":"qmuagp1wuzdt4p","question":"アルカリ性の水溶液にBTB溶液を加えると何色になるか。","answer":"青色","hint":"","explanation":"","difficulty":"基礎","tags":""},{"id":"qmuagp1wua8pqh","questio function id(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function addStandardBooks(data){for(const standard of seed)if(!data.books.some(b=>(b.sourceId||b.id)===(standard.sourceId||standard.id)))data.books.push(structuredClone(standard));return data}function load(){try{const raw=localStorage.getItem(KEY);return raw?addStandardBooks(validateBackup(JSON.parse(raw))):structuredClone({books:seed,records:{},sessions:[],theme:"light"})}catch(e){setTimeout(()=>msg("保存データを読み込めませんでした。元データを保護するため自動保存を停止しています。データ管理から復元してください。"),100);return structuredClone({books:seed,records:{},sessions:[],theme:"light",readOnly:true})}}

function esc(x=""){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function msg(x){let e=document.getElementById("toast");e.textContent=x;e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),1800)}function closeM(){document.getElementById("modal").innerHTML=""}function show(v){if(session && !session.finished){finish(false);return}topTitle.textContent=({home:"ホーム",books:"問題集",review:"復習",records:"学習記録",editor:"作成・編集"})[v]||"まなびカード";document.querySelectorAll(".view").forEach(x=>x.classList.add("hidden"));document.getElementById(v).classList.remove("hidden");document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.v===v));if(v==="home")home();if(v==="books")books();if(v==="review")review();if(v==="records")records();if(v==="editor")editor()}
function sum(){let a={learned:0,ok:0,repeat:0,checked:0};Object.values(S.records).forEach(r=>{if(r.last)a.learned++;if(r.last==="ok")a.ok++;if(r.last==="repeat")a.repeat++;if(r.checked)a.checked++});return a}function prog(b){return b.questions.length?Math.round(b.questions.filter(q=>S.records[q.id]?.last==="ok").length/b.questions.length*100):0}function bcard(b){let p=prog(b);return `<article class="card book" style="--book:${COL[b.subject]||COL.その他}"><h3>${esc(b.title)}</h3><div class="meta">${esc(b.grade||"")}　${esc(b.subject)}　${esc(b.unit||"")}</div><span class="chip">${b.questions.length}問</span><span class="chip">進捗 ${p}%</span>${b.locked?'<span class="chip">先生からの問題</span>':''}<div class="progress"><i style="width:${p}%"></i></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="settings('${b.id}')">学習する</button><button class="btn" onclick="edit('${b.id}')">${b.locked?"見る":"編集"}</button><button class="btn" onclick="exportBook('${b.id}')">配布JSON</button></div></article>`}function home(){let a=sum();topTitle.textContent="一問一答で、わかるを増やそう";document.getElementById("home").innerHTML=`<div class="hero"><div><h1>カードをめくって学ぼう</h1><p>タップで答えを確認。答えの面ではスワイプで自己判定。</p></div>${S.books[0]?`<button class="btn" onclick="settings('${S.books[0].id}')">学習開始</button>`:""}</div><div class="stats"><div class="stat"><span>学習済み</span><b>${a.learned}問</b></div><div class="stat"><span>できた</span><b>${a.ok}問</b></div><div class="stat"><span>もう一度</span><b>${a.repeat}問</b></div><div class="stat"><span>チェック</span><b>${a.checked}問</b></div></div><div class="section"><h2>問題集</h2><button class="btn primary" onclick="newBook()">＋ 新規作成</button></div><div class="grid">${S.books.map(bcard).join("")}</div>`}function books(){topTitle.textContent="問題集";document.getElementById("books").innerHTML=`<div class="section"><h2>問題集</h2><div class="row"><button class="btn primary" onclick="newBook()">＋ 新規作成</button><button class="btn" onclick="chooseFile('book')">先生の問題を読み込む</button></div></div><div class="grid">${S.books.map(bcard).join("")}</div>`}function review(){let n=0;S.books.forEach(b=>b.questions.forEach(q=>{let r=S.records[q.id];if(r?.checked||r?.last==="repeat")n++}));document.getElementById("review").innerHTML=`<div class="section"><h2>復習</h2></div><div class="card pad"><h3>${n}問の復習候補</h3><button class="btn primary" onclick="mixed()" ${n?"":"disabled"}>まとめて復習</button></div>`}function records(){let a=sum();document.getElementById("records").innerHTML='<div class="section"><h2>学習記録</h2></div><div class="stats"><div class="stat"><span>学習済み</span><b>'+a.learned+'問</b></div><div class="stat"><span>できた</span><b>'+a.ok+'問</b></div><div class="stat"><span>もう一度</span><b>'+a.repeat+'問</b></div><div class="stat"><span>学習回数</span><b>'+S.sessions.length+'回</b></div></div><h3>最近の学習（最大30回）</h3>'+([...S.sessions].reverse().slice(0,30).map(s=>'<div class="card pad" style="margin-bottom:12px"><b>'+esc(new Date(s.date).toLocaleString('ja-JP'))+'</b><p>✓ できた '+s.ok+'問　↻ もう一度 '+s.rep+'問　－ 保留 '+s.hold+'問　未採点 '+s.un+'問</p></div>').join('')||'<div class="card empty">まだ学習記録がありません。</div>')}
function settings(x){book=S.books.find(b=>b.id===x);if(!book.questions.length)return msg("問題がありません");modal.innerHTML=`<div class="modalwrap"><div class="modal"><h2>${esc(book.title)}</h2><label>出題順</label><select id="ord" class="field"><option value="normal">登録順</option><option value="random">ランダム</option><option value="reverse">逆順</option></select><label>出題範囲</label><select id="range" class="field"><option value="all">すべて</option><option value="checked">チェック</option><option value="repeat">もう一度</option><option value="unlearned">未学習</option></select><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" onclick="closeM()">閉じる</button><button class="btn primary" onclick="start()">学習開始</button></div></div></div>`}function start(){let a=[...book.questions],r=range.value,o=ord.value;if(r==="checked")a=a.filter(q=>S.records[q.id]?.checked);if(r==="repeat")a=a.filter(q=>S.records[q.id]?.last==="repeat");if(r==="unlearned")a=a.filter(q=>!S.records[q.id]?.last);if(o==="random")shuffle(a);if(o==="reverse")a.reverse();if(!a.length)return msg("条件に合う問題がありません");session={questions:a,index:0,answers:{},revealed:false,started:Date.now()};closeM();renderStudy()}function renderStudy(){if(!session||session.finished)return;showStudy();topTitle.textContent=book?.title||"復習";let q=session.questions[session.index],r=S.records[q.id]||{};study.innerHTML=`<div class="study"><div class="study-main"><div class="study-head"><button class="btn" onclick="finish(false)">終了</button><div class="progress"><i style="width:${(session.index+1)/session.questions.length*100}%"></i></div><b>${session.index+1}/${session.questions.length}</b></div><div id="flash" class="flash ${session.revealed?"revealed":""} ${cardMotion}" role="button" tabindex="0" aria-label="カードをめくる" onclick="flip(event)" onkeydown="cardKey(event)" onpointerdown="swipeStart(event)" onpointermove="swipeMove(event)" onpointerup="swipeEnd(event)" onpointercancel="swipeCancel(event)"><div class="inner"><div class="face" aria-hidden="${session.revealed}"><div class="label">問題 ${session.index+1}</div><div class="qtext">${esc(q.question)}</div>${q.hint?`<div class="helper">ヒント：${esc(q.hint)}</div>`:""}</div><div class="face back" aria-hidden="${!session.revealed}"><div class="label">答え</div><div class="atext">${esc(q.answer)}</div>${q.explanation?`<div class="helper">${esc(q.explanation)}</div>`:""}</div></div></div>${session.revealed?`<div class="swipe-guide"><span class="swipe-again">← もう一度</span><span class="swipe-hold">↓ 保留</span><span class="swipe-ok">できた →</span></div>`:`<div class="hintline">カードをタップで答え表示　・　左右スワイプで移動</div>`}<div class="controls">${session.revealed?`<button class="btn again" onclick="judge('repeat')">← もう一度</button><button class="btn hold" onclick="judge('hold')">↓ 保留</button><button class="btn ok" onclick="judge('ok')">できた →</button>`:`<button class="btn" onclick="prev()">前へ</button><button class="btn primary" onclick="reveal()">答えを見る</button><button class="btn" onclick="next()">次へ</button><button class="btn" aria-label="復習チェックを切り替える" aria-pressed="${!!r.checked}" onclick="check()">${r.checked?"★":"☆"}</button>`}</div></div><aside class="card qpanel"><h3>問題一覧</h3><div class="qgrid">${session.questions.map((x,i)=>`<button class="qnum ${i===session.index?"current":""} ${S.records[x.id]?.last==="ok"?"done":S.records[x.id]?.last==="repeat"?"repeat":""}" onclick="go(${i})">${i+1}</button>`).join("")}</div></aside></div>`}function showStudy(){document.querySelectorAll(".view").forEach(x=>x.classList.add("hidden"));study.classList.remove("hidden")}function flip(e){if(e.target.closest("button")||moving||Date.now()<suppressClickUntil)return;reveal(!session.revealed)}
function reveal(value=true){if(moving||!session||session.finished)return;session.revealed=value;const f=document.getElementById("flash");if(!f)return;f.classList.toggle("revealed",value);moving=true;motionTimer=setTimeout(()=>{moving=false;renderStudy();document.getElementById("flash")?.focus({preventScroll:true})},reduced()?0:450)}

function swipeStart(e){if(moving||!session||session.finished||e.isPrimary===false||(e.pointerType==="mouse"&&e.button!==0))return;const area=e.target.closest(".qtext,.atext,.helper");touch={x:e.clientX,y:e.clientY,id:e.pointerId,target:e.currentTarget,area:area&&area.scrollHeight>area.clientHeight+2?area:null,scroll:area?.scrollTop||0};e.currentTarget.setPointerCapture(e.pointerId)}

function newBook(){if(session&&!session.finished){finish(false);return}editId=null;qid=null;draft=null;show("editor")}function edit(x){editId=x;qid=null;draft=null;show("editor")}function editor(){topTitle.textContent="作成・編集";const editorEl=document.getElementById("editor");let b=S.books.find(x=>x.id===editId);if(!b){editorEl.innerHTML=`<div class="section"><h2>新しい問題集</h2></div><div class="card pad"><label>問題集名</label><input id="bt" class="field"><div class="formgrid"><div><label>教科</label><select id="bs" class="field">${Object.keys(COL).map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>学年</label><input id="bg" class="field"></div><div><label>単元</label><input id="bu" class="field"></div></div><button class="btn primary" style="margin-top:15px" onclick="makeBook()">作成</button></div>`;return}let q=draft||b.questions.find(x=>x.id===qid);editorEl.innerHTML=`<div class="section"><h2>${esc(b.title)}</h2><div class="row"><button class="btn" onclick="bookInfo()" ${b.locked?"disabled":""}>問題集情報</button><button class="btn" onclick="duplicateBook()">自分用に複製</button><button class="btn danger" onclick="deleteBook()">問題集を削除</button><button class="btn" onclick="bulk()" ${b.locked?"disabled":""}>一括登録</button><button class="btn primary" onclick="newQ()" ${b.locked?"disabled":""}>＋問題</button></div></div><div class="editor"><div class="card pad">${b.questions.map((x,i)=>`<div class="qrow ${x.id===qid?"selected":""}" onclick="pick('${x.id}')">${i+1}. ${esc(x.question)}</div>`).join("")}</div><div class="card pad">${q?form(q,b.locked):'<div class="empty">問題を選択してください</div>'}</div></div>`}function makeBook(){if(!bt.value.trim())return msg("問題集名が必要です");let b={id:id("b"),sourceId:id("src"),title:bt.value.trim(),subject:bs.value,grade:bg.value,unit:bu.value,color:COL[bs.value],locked:false,questions:[]};S.books.unshift(b);editId=b.id;save();editor()}function newQ(){if(S.books.find(x=>x.id===editId)?.locked)return;qid=null;draft={id:id("q"),question:"",answer:"",hint:"",expla function saveQ(){let b=S.books.find(x=>x.id===editId);if(!b||b.locked)return;let q=draft||b.questions.find(x=>x.id===qid);if(!eq.value.trim()||!ea.value.trim())return msg("問題と答えが必要です");Object.assign(q,{question:eq.value.trim(),answer:ea.value.trim(),hint:eh.value.trim(),explanation:ee.value.trim(),difficulty:ed.value,tags:et.value.trim()});if(draft){b.questions.push(q);qid=q.id;draft=null}save();editor();msg("保存しました")}function bulk(){if(S.books.find(x=>x.id===editId)?.locked)return;modal.innerHTML=`<div class="modalwrap"><div class="modal"><h2>問題を一括登録</h2><h3>CSVファイルから</h3><p class="meta">Excelなどで「問題・答え・ヒント・解説・難易度・タグ」の列を作り、CSV形式で保存してください。先頭行は見出しとして扱います。</p><div class="row"><button class="btn primary" onclick="csvFile.click()">CSVを選ぶ</button><button class="btn" onclick="downloadCsvTemplate()">ひな形を保存</button></div><hr><h3>文章を貼り付ける</h3><p class="meta">1行に1問：問題｜答え｜ヒント｜解説</p><textarea id="bulkText" class="field" style="min-height:180px" placeholder="日本の首都は？｜東京｜関東地方｜日本の首都です"></textarea><div class="row"><button class="btn primary" onclick="saveBulk()">貼り付けた問題を登録</button><button class="btn" onclick="closeM()">閉じる</button></div></div></div>`}
function addQuestions(rows){let b=S.books.find(x=>x.id===editId);if(!b||b.locked)return 0;if(rows.length>10000||b.questions.length+rows.length>10000)throw Error("1つの問題集は10000問までです");let n=0;for(const row of rows){const question=String(row.question||"").trim(),answer=String(row.answer||"").trim(),hint=String(row.hint||"").trim(),explanation=String(row.explanation||"").trim(),tags=String(row.tags||"").trim();if(!question||!answer)continue;if([question,answer,hint,explanation,tags].some(x=>x.length>50000))throw Error("1つの項目は50000文字までです");b.questions.push({id:id("q"),question,answer,hint,explanation,difficulty:["基礎","標準","発展"].includes(String(row.difficulty||"").trim())?String(row.difficulty).trim():"基礎",tags});n++}if(n)save();return n}

function parseCsv(text){const rows=[];let row=[],cell="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=""}else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=""}else if(c!=='\r')cell+=c}if(quoted)throw Error("引用符が閉じていません");if(cell||row.length){row.push(cell);rows.push(row)}return rows}
function csvHeaderName(x){return String(x||"").replace(/^\uFEFF/,"").trim().toLowerCase().replace(/[ _-]/g,"")}
function csvRows(text){const table=parseCsv(text).filter(r=>r.some(x=>String(x).trim()));if(!table.length)return[];const aliases={question:["問題","問題文","question","q"],answer:["答え","解答","answer","a"],hint:["ヒント","hint"],explanation:["解説","説明","explanation"],difficulty:["難易度","difficulty"],tags:["タグ","tag","tags"]},head=table[0].map(csvHeaderName),map={};for(const [key,names]of Object.entries(aliases)){const i=head.findIndex(x=>names.includes(x));if(i>=0)map[key]=i}if(map.question==null||map.answer==null)throw Error("見出しに「問題」と「答え」が必要です");return table.slice(1).map(r=>Object.fromEntries(Object.entries(map).map(([k,i])=>[k,r[i]||""])))}

csvFile.addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;if(f.size>10*1024*1024)return msg("CSVファイルは10MB以下にしてください");try{const rows=csvRows(await readCsvFile(f)),n=addQuestions(rows);if(!n)return msg("登録できる問題がありません");closeM();editor();msg(n+"問をCSVから登録しました")}catch(e){msg("CSVを読み込めません："+(e.message||"形式を確認してください"))}});

function textField(x,required=false){if(x==null&&!required)return "";if(typeof x!=="string"||x.length>50000||(required&&!x.trim()))throw Error("文字列が不正です");return x.trim()}
function safeId(x){if(typeof x!=="string"||!/^[a-zA-Z0-9_-]{1,160}$/.test(x)||["__proto__","constructor","prototype"].includes(x))throw Error("識別子が不正です");return x}

function validateBackup(raw){const x=raw?.format==="manabi-card-backup"?raw.data:raw;if(raw?.format&&raw.version!==1)throw Error();if(!x||!Array.isArray(x.books)||x.books.length>1000||!x.records||typeof x.records!=="object"||Array.isArray(x.records)||!Array.isArray(x.sessions))throw Error();const books=x.books.map(normalizeBook),ids=new Set(),bids=new Set(),records={};for(const b of books){if(bids.has(b.id))throw Error();bids.add(b.id);for(const q of b.questions){if(ids.has(q.id))throw Error();ids.add(q.id);const r=x.records[q.id];if(!r)continue;const row={checked:r.checked===true};for(const k of ["attempts","ok","repeat","hold"]){if(r[k]!=null&&(!Number.isSafeInteger(r[k])||r[k]<0))throw Error();row[k]=r[k]||0}if(["ok","repeat","hold"].includes(r.last))row.last=r.last;records[q.id]=row}}const sessions=x.sessions.map(s=>{const out={};for(const k of ["date","ok","rep","hold","un"]){if(!Number.isSafeInteger(s[k])||s[k]<0)throw Error();out[k]=s[k]}return out});return {books,records,sessions,theme:x.theme==="dark"?"dark":"light"}}

function importBook(x){if(x?.format!=="manabi-card-book"||x.version!==1)throw Error();const b=normalizeBook(x.book);pendingImport=b;const old=S.books.find(y=>y.locked&&y.sourceId===b.sourceId);modal.innerHTML='<div class="modalwrap"><div class="modal"><h2>問題集の読み込み確認</h2><h3>'+esc(b.title)+'</h3><p>'+esc(b.subject)+' · '+b.questions.length+'問</p><p>'+esc(b.questions[0]?.question||"問題はありません")+'</p>'+(old?'<p>同じ配布問題集があります。更新では、同じ問題IDの学習記録を引き継ぎます。</p><button class="btn primary" onclick="acceptImport(true)">更新する</button><button class="btn" onclick="acceptImport(false)">別名で保存</button>':'<button class="btn primary" onclick="acceptImport(false)">読み込む</button>')+'<button class="btn" onclick="closeM()">キャンセル</button></div></div>'}
function acceptImport(update){if(!pendingImport)return;const source=pendingImport,old=update?S.books.find(y=>y.locked&&y.sourceId===source.sourceId):null;const bySource=new Map(old?.questions.map(q=>[q.sourceQuestionId||q.id,q])||[]);const b={...source,id:old?.id||id("b"),locked:true,questions:source.questions.map(q=>({...q,id:bySource.get(q.id)?.id||id("q"),sourceQuestionId:q.id}))};if(!update&&S.books.some(y=>y.locked&&y.sourceId===b.sourceId))b.title+="（別名）";if(old){S.books.splice(S.books.indexOf(old),1,b);for(const q of old.questions)if(!b.questions.some(n=>n.id===q.id))delete S.records[q.id]}else S.books.unshift(b);pendingImport=null;save();closeM();show("books");msg("先生の問題集を読み込みました")}
file.addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;if(f.size>20*1024*1024)return msg("ファイルは20MB以下にしてください");try{const data=JSON.parse(await f.text());if(importMode==="backup"){const restored=addStandardBooks(validateBackup(data));if(!confirm("バックアップの"+restored.books.length+"問題集で、この端末の全データを置き換えますか？"))return;S=restored;save();closeM();document.body.classList.toggle("dark",S.theme==="dark");show("home");msg("バックアップを復元しました")}else importBook(data)}catch(e){msg(importMode==="backup"?"有効なバックアップJSONではありません":"まなびカードの配布用JSONではありません")}});
function openData(){modal.innerHTML='<div class="modalwrap"><div class="modal"><h2>データ管理</h2><h3>先生から問題を受け取る</h3><p>配布JSONから問題集を追加します。</p><button class="btn primary" onclick="chooseFile(\'book\')">先生の問題を読み込む</button><hr><h3>全データのバックアップ・復元</h3><p>問題集・学習記録・チェック・設定を保存します。ブラウザーのデータを消すと記録が失われるため、定期的に保存してください。</p><div class="row"><button class="btn" onclick="backup()">バックアップを保存</button><button class="btn" onclick="chooseFile(\'backup\')">バックアップを復元</button></div><p class="meta">学習データはこのブラウザー内に保存され、アプリから外部へ送信されません。Ver.4.3</p><div class="row"><button class="btn danger" onclick="resetAll()">全データを初期化</button><button class="btn" onclick="closeM()">閉じる</button></div></div></div>'}
function backup(){download("manabi-card-backup.json",JSON.stringify({format:"manabi-card-backup",version:1,data:S,exportedAt:new Date().toISOString()},null,2),"application/json")}
function download(n,t,m){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([t],{type:m}));a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function resetAll(){if(confirm("全データを初期化しますか？")){S=structuredClone({books:seed,records:{},sessions:[],theme:"light"});if(save())location.reload()}}function toggleTheme(){S.theme=S.theme==="dark"?"light":"dark";document.body.classList.toggle("dark",S.theme==="dark");save()}document.body.classList.toggle("dark",S.theme==="dark");home();

function bookInfo(){const b=S.books.find(x=>x.id===editId);if(!b||b.locked)return;modal.innerHTML='<div class="modalwrap"><div class="modal"><h2>問題集情報</h2><label>問題集名</label><input class="field" id="ibt" value="'+esc(b.title)+'"><label>教科</label><select class="field" id="ibs">'+Object.keys(COL).map(x=>'<option '+(x===b.subject?'selected':'')+'>'+x+'</option>').join('')+'</select><label>学年</label><input class="field" id="ibg" value="'+esc(b.grade)+'"><label>単元</label><input class="field" id="ibu" value="'+esc(b.unit)+'"><div class="row"><button class="btn primary" onclick="saveBookInfo()">保存</button><button class="btn" onclick="closeM()">閉じる</button></div></div></div>'}
function saveBookInfo(){const b=S.books.find(x=>x.id===editId);if(!b||b.locked)return;if(!ibt.value.trim())return msg("問題集名が必要です");Object.assign(b,{title:ibt.value.trim(),subject:ibs.value,grade:ibg.value.trim(),unit:ibu.value.trim(),color:COL[ibs.value]});save();closeM();editor()}
function duplicateBook(){const b=S.books.find(x=>x.id===editId);const n={...b,id:id("b"),sourceId:id("src"),locked:false,title:b.title+"（自分用）",questions:b.questions.map(q=>{const {sourceQuestionId,...rest}=q;return {...rest,id:id("q")}})};S.books.unshift(n);save();edit(n.id);msg("自分用の問題集を作成しました")}
function deleteBook(){const b=S.books.find(x=>x.id===editId);if(!b||!confirm('「'+b.title+'」と、この問題集の学習記録を削除しますか？'))return;S.books=S.books.filter(x=>x.id!==b.id);for(const q of b.questions)delete S.records[q.id];save();show("books")}
function deleteQ(){const b=S.books.find(x=>x.id===editId);if(!b||b.locked||!confirm("この問題と学習記録を削除しますか？"))return;b.questions=b.questions.filter(q=>q.id!==qid);delete S.records[qid];qid=null;save();editor()}
function moveQ(delta){const b=S.books.find(x=>x.id===editId);if(!b||b.locked)return;const i=b.questions.findIndex(q=>q.id===qid),j=i+delta;if(i<0||j<0||j>=b.questions.length)return;[b.questions[i],b.questions[j]]=[b.questions[j],b.questions[i]];save();editor()}
// Apply labels and modal focus management after dynamic rendering.
let lastDialog=null,lastFocus=null;
new MutationObserver(()=>{document.querySelectorAll('label:not([for])').forEach(l=>{const n=l.nextElementSibling;if(n?.id)l.htmlFor=n.id});document.querySelectorAll('.nav').forEach(n=>n.setAttribute('aria-label',n.textContent.trim()));document.querySelectorAll('.qrow').forEach(n=>{n.tabIndex=0;n.setAttribute('role','button');n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();n.click()}}});const b=S.books.find(x=>x.id===editId);if(b?.locked)document.querySelectorAll('#editor .field').forEach(n=>n.disabled=true);const d=document.querySelector('.modal');if(d!==lastDialog){if(d){if(!lastDialog)lastFocus=document.activeElement;d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-label',d.querySelector('h2')?.textContent||'確認');d.tabIndex=-1;d.focus()}else lastFocus?.focus?.();lastDialog=d}}).observe(document.body,{childList:true,subtree:true});
document.addEventListener('keydown',e=>{const d=document.querySelector('.modal');if(!d)return;if(e.key==='Escape'&&!session?.finished)closeM();if(e.key==='Tab'){const a=[...d.querySelectorAll('button:not(:disabled),input,select,textarea,[tabindex="0"]')];if(!a.length){e.preventDefault();return}if(e.shiftKey&&(document.activeElement===a[0]||document.activeElement===d)){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&(document.activeElement===a.at(-1)||document.activeElement===d)){e.preventDefault();a[0].focus()}}});

</script></body></html>
